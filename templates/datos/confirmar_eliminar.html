{% extends "base.html" %}

{% block title %}Eliminar Ítem - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card" style="text-align: center;">
        <span class="auth-icon">⚠️</span>
        <h2>¿Eliminar este Ítem?</h2>
        <p style="margin: 1rem 0 1.5rem 0; color: var(--text-muted); line-height: 1.5;">
            ¿Estás seguro/a de que querés eliminar el ítem <strong>"{{ item.titulo }}"</strong>? Esta acción no se puede deshacer.
        </p>

        <form method="post">
            {% csrf_token %}
            <div style="display: flex; justify-content: center; gap: 1rem;">
                <a href="{% url 'datos:detalle' item.pk %}" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sí, Confirmar y Eliminar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
