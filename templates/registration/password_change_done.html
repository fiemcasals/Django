{% extends "base.html" %}

{% block title %}Contraseña Cambiada - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card" style="text-align: center;">
        <span class="auth-icon">✅</span>
        <h2>¡Contraseña Cambiada!</h2>
        <p style="margin: 1rem 0 1.5rem 0; color: var(--text-muted); line-height: 1.5;">
            Tu contraseña ha sido actualizada exitosamente y tu sesión se mantiene activa.
        </p>
        <a href="{% url 'usuarios:perfil' %}" class="btn btn-primary btn-block">Volver a mi Perfil</a>
    </div>
</div>
{% endblock %}
