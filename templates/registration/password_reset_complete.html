{% extends "base.html" %}

{% block title %}Contraseña Restablecida - {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card" style="text-align: center;">
        <span class="auth-icon">🎉</span>
        <h2>¡Contraseña Actualizada con Éxito!</h2>
        <p style="margin: 1rem 0 1.5rem 0; color: var(--text-muted); line-height: 1.5;">
            Tu contraseña ha sido restablecida correctamente. Ya podés iniciar sesión con tus nuevas credenciales.
        </p>
        <a href="{% url 'usuarios:login' %}" class="btn btn-primary btn-block">Iniciar Sesión Ahora</a>
    </div>
</div>
{% endblock %}
